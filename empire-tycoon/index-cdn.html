<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#16283a">
<title>Empire Tycoon</title>
<style>
:root{--ink:#16283a;--card:rgba(255,255,255,.93);--gold:#ffc93a;--gold2:#f19a0b;--green:#46c453;--green2:#2a8f38;--blue:#2d8cf0;--red:#e5484d;--panel:#f3f7fb;--muted:#6b7c8f}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;user-select:none;-webkit-user-select:none}
html,body{margin:0;height:100%;overflow:hidden;background:#9fd0f5;font-family:system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;color:var(--ink);touch-action:none;overscroll-behavior:none}
button{font:inherit;color:inherit;border:0;cursor:pointer;padding:0;background:none}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
#cards,#fx{position:fixed;inset:0;pointer-events:none;overflow:hidden}
.card{position:absolute;left:0;top:0;width:150px;transform-origin:0 0;pointer-events:none;will-change:transform}
.card.hide{display:none}
.card .box{pointer-events:auto;background:var(--card);border-radius:12px;box-shadow:0 3px 0 rgba(10,30,60,.28),0 6px 14px rgba(10,30,60,.22);padding:5px 6px 6px;border:2px solid #fff}
.c-head{display:flex;align-items:center;gap:4px;font-weight:800;font-size:12px;line-height:1.1}
.c-dot{width:9px;height:9px;border-radius:50%;flex:none;box-shadow:0 0 0 2px #fff,0 0 0 3px rgba(0,0,0,.15)}
.c-name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.c-lvl{background:#16283a;color:#fff;border-radius:8px;padding:1px 6px;font-size:11px}
.c-x2{display:none;color:#e29a00;font-size:12px;font-weight:900;margin-left:-1px}
.dc .c-dot{box-shadow:0 0 0 2px #fff,0 0 0 4px #ffc93a}.c-x2{display:none!important}
.c-bar{position:relative;height:17px;margin-top:4px;background:#d8e3ee;border-radius:9px;overflow:hidden;box-shadow:inset 0 1px 3px rgba(0,0,0,.25)}
.c-bar i{position:absolute;left:0;top:0;bottom:0;width:100%;transform-origin:0 50%;transform:scaleX(0);background:linear-gradient(#ffe27a,#f5b11c)}
.c-bar span,.c-bar b{position:absolute;top:0;line-height:17px;font-size:11px;font-weight:800;text-shadow:0 1px 0 rgba(255,255,255,.7)}
.c-bar span{left:6px}.c-bar b{right:6px;font-variant-numeric:tabular-nums}
.c-ms{height:3px;margin:3px 2px 0;background:#d8e3ee;border-radius:2px;overflow:hidden}
.c-ms i{display:block;height:100%;width:100%;transform-origin:0 50%;background:#8a5cf0;transform:scaleX(0)}
.c-up,.c-buy{display:flex;width:100%;margin-top:5px;align-items:center;justify-content:space-between;gap:4px;padding:6px 8px;border-radius:10px;font-weight:900;font-size:12px;color:#fff;background:linear-gradient(#5fdc6c,var(--green));box-shadow:0 3px 0 var(--green2);text-shadow:0 1px 0 rgba(0,0,0,.35);transition:transform .08s}
.c-up:active,.c-buy:active{transform:translateY(2px);box-shadow:0 1px 0 var(--green2)}
.c-up b,.c-buy b{font-variant-numeric:tabular-nums;background:rgba(0,0,0,.2);padding:1px 6px;border-radius:7px}
.c-up.no,.c-buy.no{background:linear-gradient(#aab6c2,#8b98a6);box-shadow:0 3px 0 #6f7c8a}
.card.next .box{border-color:var(--gold)}
.card.next .c-buy{background:linear-gradient(#ffd45a,var(--gold2));box-shadow:0 3px 0 #b36d00;margin-top:4px}
.card.next .c-buy.no{background:linear-gradient(#aab6c2,#8b98a6);box-shadow:0 3px 0 #6f7c8a}
.card.next.pulse .box{animation:pulse 1.1s infinite}
@keyframes pulse{50%{transform:scale(1.06)}}
.card.lock .box{background:rgba(40,55,75,.72);color:#dfe8f1;border-color:rgba(255,255,255,.4);padding:4px 8px;font-size:11.5px;font-weight:800;pointer-events:none}
.card.lock .c-name{font-weight:800}
.tip{position:absolute;left:50%;bottom:100%;transform:translate(-50%,-6px);background:#16283a;color:#fff;font-size:11.5px;padding:5px 9px;border-radius:9px;white-space:nowrap;font-weight:700;animation:bob 1s infinite}
@keyframes bob{50%{transform:translate(-50%,-11px)}}
.flt{position:absolute;left:0;top:0;font-weight:900;font-size:15px;color:#fff6c2;text-shadow:0 2px 0 #7a4b00,0 0 6px rgba(0,0,0,.5);white-space:nowrap;animation:flt 1.2s ease-out forwards}
.flt.big{font-size:20px;color:#fff}
@keyframes flt{0%{opacity:0;transform:translate(var(--x),var(--y)) translate(-50%,0) scale(.6)}15%{opacity:1}100%{opacity:0;transform:translate(var(--x),calc(var(--y) - 70px)) translate(-50%,0) scale(1.1)}}
#hud{position:fixed;inset:0;pointer-events:none;padding:env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left)}
#hud>*{pointer-events:auto}
#top{position:absolute;left:8px;right:8px;top:calc(env(safe-area-inset-top) + 8px);display:flex;gap:8px;align-items:stretch;pointer-events:none}
#top>*{pointer-events:auto}
.chip{background:rgba(22,40,58,.86);color:#fff;border-radius:14px;padding:6px 12px;border:2px solid rgba(255,255,255,.65);box-shadow:0 3px 0 rgba(0,0,0,.25)}
#cashbox{flex:1;display:flex;align-items:center;gap:8px;min-width:0}
#cashbox .coin{width:30px;height:30px;border-radius:50%;flex:none;background:radial-gradient(circle at 35% 30%,#fff3a0,#ffc93a 55%,#c98300);display:grid;place-items:center;font-weight:900;color:#7a4b00;box-shadow:0 2px 0 #7a4b00}
#cash{font-size:22px;font-weight:900;line-height:1;font-variant-numeric:tabular-nums;color:#ffe27a;white-space:nowrap}
#ps{font-size:11.5px;opacity:.85;font-weight:700;margin-top:2px}
#count{display:flex;flex-direction:column;align-items:center;justify-content:center;font-weight:900;font-size:17px;line-height:1}
#count small{font-size:10px;opacity:.8;font-weight:700}
#evt{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 66px);transform:translateX(-50%);max-width:92%;display:none;background:linear-gradient(#a56dff,#6f3de0);color:#fff;font-weight:800;font-size:12.5px;padding:6px 14px;border-radius:20px;border:2px solid #fff;box-shadow:0 3px 0 rgba(0,0,0,.25);text-align:center;pointer-events:none}
#rail{position:absolute;left:8px;top:calc(env(safe-area-inset-top) + 74px);display:flex;flex-direction:column;gap:9px;pointer-events:none}
#rail>*{pointer-events:auto}
.rb{position:relative;width:54px;height:54px;border-radius:16px;font-size:24px;display:grid;place-items:center;background:linear-gradient(#ffffff,#d9e6f3);border:3px solid #fff;box-shadow:0 3px 0 rgba(10,30,60,.35);overflow:hidden}
.rb small{position:absolute;left:0;right:0;bottom:1px;text-align:center;font-size:10.5px;font-weight:900;color:var(--ink);font-variant-numeric:tabular-nums}
.rb.on{background:linear-gradient(#ffe27a,#f5a60c);animation:pulse 1s infinite}
.rb.cd{filter:grayscale(.85);opacity:.8}
.rb.vip{background:linear-gradient(#ffd45a,#ef8a0a);animation:pulse .9s infinite}
.rb.star{background:linear-gradient(#c9a3ff,#7a45ee)}
#mult{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 92px);min-width:62px;height:42px;border-radius:21px;font-weight:900;font-size:17px;color:#fff;background:linear-gradient(#4aa3ff,#1f6fd6);border:3px solid #fff;box-shadow:0 3px 0 rgba(10,30,60,.4)}
#hint{position:absolute;left:50%;bottom:calc(env(safe-area-inset-bottom) + 146px);transform:translateX(-50%);max-width:86%;background:rgba(22,40,58,.9);color:#fff;font-weight:700;font-size:13px;padding:8px 14px;border-radius:14px;text-align:center;display:none;pointer-events:none;animation:bob2 1.4s infinite}
@keyframes bob2{50%{transform:translateX(-50%) translateY(-5px)}}
#nav{position:absolute;left:0;right:0;bottom:0;padding:8px 6px calc(env(safe-area-inset-bottom) + 8px);display:flex;justify-content:space-around;align-items:flex-end;gap:4px;background:linear-gradient(rgba(22,40,58,0),rgba(22,40,58,.55) 45%)}
.nb{position:relative;flex:1;max-width:84px;display:flex;flex-direction:column;align-items:center;gap:2px;color:#fff;font-weight:800;font-size:10.5px;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.nb .ic{width:54px;height:54px;border-radius:17px;display:grid;place-items:center;font-size:25px;background:linear-gradient(#5aa8ff,#2468d4);border:3px solid #fff;box-shadow:0 3px 0 rgba(10,30,60,.4);text-shadow:none}
.nb.g .ic{background:linear-gradient(#5fdc6c,#2a9b38)}.nb.o .ic{background:linear-gradient(#ffb64d,#ec7a08)}.nb.p .ic{background:linear-gradient(#b987ff,#7340e0)}.nb.k .ic{background:linear-gradient(#8fa3b8,#566a80)}
.nb:active .ic{transform:translateY(2px)}
.bdg{position:absolute;top:-4px;right:calc(50% - 34px);min-width:20px;height:20px;border-radius:10px;background:var(--red);color:#fff;font-size:11.5px;font-weight:900;display:none;place-items:center;padding:0 5px;border:2px solid #fff;text-shadow:none}
#slots{display:flex;gap:4px;align-items:center}
.slot{width:38px;height:54px;border-radius:12px;background:rgba(255,255,255,.88);border:3px solid #fff;box-shadow:0 3px 0 rgba(10,30,60,.4);overflow:hidden;display:grid;place-items:center;font-size:18px;color:#8b98a6}
.slot img{width:100%;height:100%;object-fit:cover}
#veil{position:fixed;inset:0;background:rgba(10,25,45,.55);display:none;z-index:20;touch-action:none}
#sheet{position:fixed;left:0;right:0;bottom:0;max-height:88%;display:none;flex-direction:column;z-index:21;background:var(--panel);border-radius:22px 22px 0 0;box-shadow:0 -6px 30px rgba(0,0,0,.4);padding-bottom:env(safe-area-inset-bottom);touch-action:pan-y;animation:up .22s ease-out;max-width:640px;margin:0 auto}
@keyframes up{from{transform:translateY(40px);opacity:0}}
#sheet header{display:flex;align-items:center;justify-content:space-between;padding:12px 16px 8px;font-weight:900;font-size:19px}
#sheet header button{width:36px;height:36px;border-radius:50%;background:var(--red);color:#fff;font-weight:900;font-size:18px;box-shadow:0 2px 0 #9c2025}
#sbody{overflow:auto;padding:4px 14px 16px;-webkit-overflow-scrolling:touch}
#modal{position:fixed;left:50%;top:50%;transform:translate(-50%,-50%);width:min(88vw,360px);display:none;z-index:30;background:var(--panel);border-radius:22px;border:3px solid #fff;box-shadow:0 10px 40px rgba(0,0,0,.5);padding:18px 16px 16px;text-align:center;animation:pop .25s ease-out;max-height:92%;overflow:auto}
@keyframes pop{from{transform:translate(-50%,-46%) scale(.85);opacity:0}}
#modal h2{margin:0 0 6px;font-size:21px}
#modal p{margin:6px 0;font-size:14px;color:#33485c}
#modal .big{font-size:30px;font-weight:900;color:#c77a00;margin:6px 0;font-variant-numeric:tabular-nums}
#modal .row{display:flex;gap:8px;margin-top:12px}
.btn{flex:1;padding:11px 10px;border-radius:13px;font-weight:900;font-size:15px;color:#fff;background:linear-gradient(#5fdc6c,var(--green));box-shadow:0 4px 0 var(--green2);text-shadow:0 1px 0 rgba(0,0,0,.3)}
.btn:active{transform:translateY(2px);box-shadow:0 2px 0 var(--green2)}
.btn.gold{background:linear-gradient(#ffd45a,var(--gold2));box-shadow:0 4px 0 #b36d00}
.btn.gray{background:linear-gradient(#aab6c2,#8b98a6);box-shadow:0 4px 0 #6f7c8a}
.btn.red{background:linear-gradient(#ff7b7f,var(--red));box-shadow:0 4px 0 #9c2025}
.btn.blue{background:linear-gradient(#4aa3ff,#1f6fd6);box-shadow:0 4px 0 #134a93}
.btn.no{background:linear-gradient(#c3ccd6,#a4afbb);box-shadow:0 4px 0 #86919d;color:#eef}
.btn.sm{flex:none;padding:7px 12px;font-size:13px;border-radius:11px}
.qrow,.lrow{display:flex;align-items:center;gap:10px;background:#fff;border-radius:14px;padding:9px 10px;margin:8px 0;box-shadow:0 2px 0 rgba(10,30,60,.12)}
.qrow .qt{flex:1;min-width:0}.qrow .qn{font-weight:800;font-size:14px}.qrow .qr{font-size:12px;color:#b86e00;font-weight:800}
.pb{height:9px;background:#dbe5ee;border-radius:5px;overflow:hidden;margin:5px 0 2px}.pb i{display:block;height:100%;background:linear-gradient(#7fe88a,#3cba4a)}
.lrow{font-size:13px;font-weight:600}.lrow small{color:var(--muted);margin-left:auto;white-space:nowrap}
.sec{font-weight:900;font-size:13px;color:var(--muted);text-transform:uppercase;letter-spacing:.06em;margin:14px 2px 4px}
.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.adv{position:relative;background:#fff;border-radius:14px;padding:6px 4px 7px;text-align:center;font-size:11px;font-weight:700;border:3px solid #dbe5ee;box-shadow:0 2px 0 rgba(10,30,60,.12)}
.adv img{width:100%;aspect-ratio:1;border-radius:10px;display:block}
.adv .an{font-weight:900;font-size:12px;margin-top:3px}.adv .ap{font-size:10px;color:#475b70;margin-top:2px;line-height:1.2}
.adv.eq{outline:3px solid var(--green)}.adv.lk{filter:grayscale(1);opacity:.55}
.adv .cnt{position:absolute;top:2px;right:2px;background:#16283a;color:#fff;border-radius:9px;padding:0 6px;font-size:11px}
.r0{border-color:#b4c0cc}.r1{border-color:#3d9bff}.r2{border-color:#a45cff}.r3{border-color:#ffb01f;background:#fff7dc}
.rt0{color:#6b7c8f}.rt1{color:#2d7fe0}.rt2{color:#8a3df0}.rt3{color:#d58a00}
.setrow{display:flex;align-items:center;justify-content:space-between;gap:10px;background:#fff;border-radius:14px;padding:10px 12px;margin:8px 0;font-weight:800;font-size:14px}
.tg{width:52px;height:30px;border-radius:15px;background:#b8c4d0;position:relative;transition:.15s}.tg::after{content:"";position:absolute;left:3px;top:3px;width:24px;height:24px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.4);transition:.15s}.tg.on{background:var(--green)}.tg.on::after{left:25px}
.seg{display:flex;gap:4px}.seg button{padding:6px 10px;border-radius:10px;background:#dbe5ee;font-weight:800;font-size:12.5px}.seg button.on{background:var(--blue);color:#fff}
input.tx,textarea.tx{width:100%;border-radius:11px;border:2px solid #c9d6e2;padding:9px 10px;font:inherit;font-size:14px;margin-top:6px;user-select:text;-webkit-user-select:text;background:#fff;color:var(--ink)}
textarea.tx{height:70px;font-size:11px;word-break:break-all}
.note{font-size:12px;color:var(--muted);font-weight:600;margin:4px 2px}
#board{display:grid;grid-template-columns:repeat(6,1fr);grid-template-rows:repeat(6,1fr);gap:3px;aspect-ratio:1;width:100%;max-width:380px;margin:6px auto}
.tile{position:relative;border-radius:8px;background:#fff;border:2px solid #dbe5ee;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:9px;font-weight:800;line-height:1.05;text-align:center;overflow:hidden}
.tile b{font-size:17px;line-height:1}.tile.cash{background:#e6f7e8}.tile.chance{background:#fff2d1}.tile.tax{background:#fde1e1}.tile.boost{background:#e4ecff}.tile.start,.tile.park{background:#d7f0ff}.tile.jail{background:#e9e0f7}.tile.adv{background:#f3e3ff}
.tile.cur{outline:3px solid var(--gold2);z-index:2}
.tok{position:absolute;width:18px;height:18px;top:2px;right:2px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ff9aa0,#e5484d 60%,#8e1b20);border:2px solid #fff;box-shadow:0 2px 4px rgba(0,0,0,.45)}
#bmid{grid-column:2/6;grid-row:2/6;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:6px;padding:4px;text-align:center}
.dice{display:flex;gap:10px}.die{width:46px;height:46px;border-radius:11px;background:#fff;border:2px solid #16283a;box-shadow:0 3px 0 rgba(0,0,0,.25);display:grid;place-items:center;font-size:30px;font-weight:900}
.die.roll{animation:shake .12s infinite}@keyframes shake{25%{transform:rotate(-14deg) translateY(-3px)}75%{transform:rotate(14deg) translateY(2px)}}
#dres{font-size:12px;font-weight:700;min-height:48px;color:#33485c}
#splash{position:fixed;inset:0;z-index:40;display:flex;flex-direction:column;align-items:center;justify-content:flex-end;padding-bottom:12vh;background:linear-gradient(rgba(14,30,55,.25),rgba(14,30,55,.7));color:#fff;text-align:center}
#splash h1{margin:0;font-size:min(13vw,60px);font-weight:900;letter-spacing:.02em;text-shadow:0 4px 0 #7a4b00,0 0 24px rgba(0,0,0,.5);color:#ffd84d;line-height:1}
#splash h1 span{display:block;font-size:.42em;color:#fff;text-shadow:0 3px 0 #123e7a,0 0 14px rgba(0,0,0,.5);letter-spacing:.2em;margin-bottom:6px}
#splash p{margin:14px 0 0;font-size:19px;font-weight:800;animation:blink 1.4s infinite}
@keyframes blink{50%{opacity:.35}}
#splash small{margin-top:18px;opacity:.8;font-weight:700;font-size:12.5px;padding:0 20px}
#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top) + 110px);transform:translateX(-50%);background:#16283a;color:#fff;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:14px;z-index:35;display:none;max-width:90%;text-align:center;border:2px solid #fff;pointer-events:none}
.stars{color:#ffb01f;font-size:26px;letter-spacing:2px}
@media (max-height:480px){#nav .nb .ic{width:44px;height:44px;font-size:20px}.nb span.lb{display:none}.slot{width:32px;height:44px}#mult{bottom:calc(env(safe-area-inset-bottom) + 68px)}#hint{bottom:calc(env(safe-area-inset-bottom) + 104px)}#rail{top:calc(env(safe-area-inset-top) + 60px)}.rb{width:44px;height:44px;font-size:20px}#sheet{max-height:96%}}
.card.lock .c-bar,.card.lock .c-ms,.card.lock .c-up,.card.lock .c-buy,.card.lock .c-lvl,.card.lock .c-x2,.card.lock .c-dot{display:none}
.card.next .c-bar,.card.next .c-ms,.card.next .c-up,.card.next .c-lvl,.card.next .c-x2{display:none}
.card.own .c-buy{display:none}
#bmid .btn{flex:none;width:100%;padding:8px 6px;font-size:14px}
.card.inc .box{border-color:var(--red);animation:pulse 1.2s infinite}.card.inc .c-bar{background:#ffd0d3}.card.inc .c-bar i{display:none}.card.inc .c-bar span{color:#8e1b20}.card.inc .c-up{background:linear-gradient(#ff7b7f,var(--red));box-shadow:0 3px 0 #9c2025}.card.inc .c-up.no{background:linear-gradient(#aab6c2,#8b98a6);box-shadow:0 3px 0 #6f7c8a}
.c-cp{display:none;font-size:10px;font-weight:800;color:#b0262c;margin-top:3px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.card.cmp .c-cp{display:block}.card.lock .c-cp,.card.next .c-cp{display:none!important}
#dt{font-size:10.5px;opacity:.8;font-weight:700;margin-top:1px;white-space:nowrap}
#cashbox{cursor:pointer}
#fab{position:absolute;right:10px;bottom:calc(env(safe-area-inset-bottom) + 144px);width:62px;height:62px;border-radius:50%;font-size:30px;background:linear-gradient(#ffd45a,var(--gold2));border:3px solid #fff;box-shadow:0 4px 0 #b36d00;display:grid;place-items:center}
#fab:active{transform:translateY(2px)}#fab.no{background:linear-gradient(#c3ccd6,#9aa6b3);box-shadow:0 4px 0 #6f7c8a}
#fab i{position:absolute;top:-4px;right:-4px;min-width:22px;height:22px;border-radius:11px;background:var(--red);color:#fff;font:900 12px/22px system-ui;font-style:normal;text-align:center;border:2px solid #fff}
#rollres{position:absolute;left:50%;top:calc(env(safe-area-inset-top) + 112px);transform:translateX(-50%);max-width:90%;display:none;background:rgba(22,40,58,.92);color:#fff;font-weight:800;font-size:13.5px;padding:9px 16px;border-radius:14px;border:2px solid var(--gold);text-align:center;pointer-events:none}
#dover{position:fixed;left:50%;top:38%;transform:translate(-50%,-50%);display:none;gap:14px;z-index:15;pointer-events:none}
#dover .die{width:64px;height:64px;font-size:44px;border-radius:15px}
@media (max-height:480px){#fab{bottom:calc(env(safe-area-inset-bottom) + 118px);width:52px;height:52px;font-size:24px}#rollres{top:calc(env(safe-area-inset-top) + 66px)}}
.c-up b,.c-buy b{white-space:nowrap}

</style>
</head>
<body>
<canvas id="gl"></canvas>
<div id="cards"></div>
<div id="fx"></div>
<div id="hud">
  <div id="top">
    <div class="chip" id="cashbox"><div class="coin">€</div><div style="min-width:0"><div id="cash">0 €</div><div id="ps">+0 €/s</div><div id="dt"></div></div></div>
    <div class="chip" id="count"><span id="cnt">0/12</span><small>commerces</small></div>
  </div>
  <div id="evt"></div>
  <div id="rail"></div>
  <div id="hint"></div>
  <button id="mult">×1</button>
  <button id="fab"><span>🎲</span><i id="fabn"></i></button>
  <div id="rollres"></div>

    var s = S(); Sfx.set(s.set.sound, s.set.music); syncCity(false); Gfx.pawnSet(s.dice.pos); Gfx.setView(window.innerHeight > window.innerWidth ? 38 : 22); var nb = nextToBuy(); if (nb <= 0) Gfx.focusPlot(0, true, 1); else Gfx.focusPlot(nb - 1, true, nb);
    var done = function () { $('splash').style.display = 'none'; };
    $('splash').addEventListener('click', function () { if (started) return; started = true; Sfx.init(); Sfx.click(); done(); if (UI.pendingOffline) { offlineModal(UI.pendingOffline); UI.pendingOffline = null; } }, { once: false });
  }
  function update(dt, rdt) {
    if (Gfx.pawnMoving()) { var pw = Gfx.pawnPos(); Gfx.focusPoint(pw.x, pw.z); }
    updateCards(); updateHud(dt); watchFps(rdt);
    // textes flottants des commerces en continu
    for (var i = 0; i < BIZ.length; i++) { if (S().biz[i].n <= 0 || Engine.time(i) >= 0.25) continue; contT[i] = (contT[i] || 0) + dt; if (contT[i] > 1.6) { var p = Gfx.cardPos(i); if (started && p.x > 0 && p.x < window.innerWidth) { floatText(p.x, p.y - 108, '+' + money(Engine.perSec(i) * contT[i])); Sfx.coin(); } contT[i] = 0; } }
    smokeT -= dt; if (smokeT <= 0) { smokeT = 1.1; for (var k = 0; k < BIZ.length; k++) if (S().inc[k] && S().biz[k].n > 0) { var pp = Gfx.info().plots[k].pos; Gfx.puff(pp.x, 3.5, pp.z); } }
    if (curSheet === 'dice' || curSheet === 'quests') { panelT -= rdt; if (panelT <= 0) { panelT = 1; if (curSheet === 'dice') diceInfo(); else renderPanel(); } }
  }
  var panelT = 0, smokeT = 0;
  return { init: init, update: update, syncCity: syncCity, applyQuality: applyQuality, offlineModal: offlineModal, showModal: showModal, toast: toast, pendingOffline: null, isStarted: function () { return started; }, openPanel: openPanel, closePanel: closePanel, showVip: showVip, floatText: floatText, tap: tap };
})();

/* =====================================================================
 * 5. BOUCLE PRINCIPALE
 * ===================================================================== */
(function () {
  var cv = document.getElementById('gl'), last = 0, saveT = 0, frameN = 0, errBox = null;
  function fail(msg) { var d = document.createElement('div'); d.style.cssText = 'position:fixed;inset:0;z-index:99;background:#16283a;color:#fff;padding:24px;font:16px system-ui;display:flex;align-items:center;justify-content:center;text-align:center'; d.textContent = msg; document.body.appendChild(d); }
  if (!window.THREE) { fail('Impossible de charger le moteur 3D (Three.js).'); return; }
  var loaded = Engine.load(); Engine.init(loaded);
  var off = loaded ? Engine.offline() : null;
  try { Gfx.init(cv, 'medium'); } catch (e) { fail('Votre appareil ne prend pas en charge WebGL : ' + e.message); return; }
  var R = Gfx.info().renderer; R.shadowMap.autoUpdate = false;
  UI.init(); UI.applyQuality(); UI.pendingOffline = off;
  var wasPortrait = window.innerHeight > window.innerWidth;
  window.addEventListener('resize', function () { var pt = window.innerHeight > window.innerWidth; if (pt !== wasPortrait) { wasPortrait = pt; Gfx.setView(pt ? 38 : 22); } Gfx.resize(); });
  window.addEventListener('orientationchange', function () { setTimeout(Gfx.resize, 200); });
  function save() { Engine.save(); }
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) { save(); } else { var o = Engine.offline(); Engine.state().last = Engine.now(); last = 0; if (o && UI.isStarted()) UI.offlineModal(o); }
  });
  window.addEventListener('pagehide', save);
  function loop(t) {
    requestAnimationFrame(loop);
    var rdt = last ? Math.min(0.25, (t - last) / 1000) : 0.016; last = t; var dt = Math.min(rdt, 0.1);
    Engine.tick(dt); Gfx.frame(dt); UI.update(dt, rdt);
    if (frameN++ % 3 === 0) R.shadowMap.needsUpdate = true;
    Gfx.render();
    saveT += rdt; if (saveT > 10) { saveT = 0; save(); }
  }
  requestAnimationFrame(loop);
})();
