name: Build APK
on:
  workflow_dispatch:
  push:
    paths: ['gargote/**', '.github/workflows/build-apk.yml']
jobs:
  apk:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: gargote } }
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22 }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: ./build-www.sh
      - run: npm install
      - run: npx cap add android
      - run: npx cap sync android
      - run: ./gradlew assembleDebug
        working-directory: gargote/android
      - uses: actions/upload-artifact@v4
        with:
          name: gargote-apk
          path: gargote/android/app/build/outputs/apk/debug/app-debug.apk
